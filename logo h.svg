<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Shield Icon -->
  <g transform="translate(10, 8)">
    <rect width="64" height="64" rx="14" fill="#0b111e" stroke="rgba(56,189,248,0.2)" stroke-width="1.5"/>
    <path d="M32 10 L50 17 V30 C50 42 42 50 32 54 C22 50 14 42 14 30 V17 Z" 
          fill="url(#logoGrad)" fill-opacity="0.25" stroke="url(#logoGrad)" stroke-width="2.5" filter="url(#logoGlow)"/>
    <path d="M26 31 L30 35 L38 27" stroke="#00f2fe" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Brand Text -->
  <text x="88" y="38" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="900" font-size="22" letter-spacing="1">CYBER SHIELD</text>
  <rect x="250" y="22" width="60" height="20" rx="4" fill="rgba(0,242,254,0.15)" stroke="#00f2fe" stroke-width="1"/>
  <text x="256" y="36" fill="#00f2fe" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="11">SOC v6.0</text>
  <text x="88" y="58" fill="#94a3b8" font-family="'Inter', sans-serif" font-weight="500" font-size="12" letter-spacing="0.5">Autonomous Threat Defense &amp; Incident Operations</text>
</svg>